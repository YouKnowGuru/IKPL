version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - MONGODB_URI=mongodb://mongo:27017/feed-distribution
      - JWT_SECRET=your-super-secret-jwt-key-change-in-production
      - NEXTAUTH_SECRET=your-super-secret-nextauth-key-change-in-production
      - NEXTAUTH_URL=http://localhost:3000
      - DELIVERY_CHARGE=150
    depends_on:
      - mongo
    dns:
      - 8.8.8.8
      - 8.8.4.4
    restart: unless-stopped

  mongo:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    dns:
      - 8.8.8.8
      - 8.8.4.4
    restart: unless-stopped

volumes:
  mongo-data:
